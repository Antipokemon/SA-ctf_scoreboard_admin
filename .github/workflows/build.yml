name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test
        run: make test
      - name: Build installable Splunk app
        run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: SA-ctf_scoreboard_admin-10.4.1
          path: |
            dist/SA-ctf_scoreboard_admin-10.4.1.tar.gz
            dist/SA-ctf_scoreboard_admin-10.4.1.tar.gz.sha256
